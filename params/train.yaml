params: 
  model_type: boosting
  
  logreg:
    C: 1.0
    penalty: l2
    solver: lbfgs
    max_iter: 100
  
  randomforest:
    n_estimators: 100
    criterion: "gini"
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
  
  boosting:
    learning_rate: 0.1
    n_estimators: 100
    subsample: 1.0
    min_samples_split: 2
    min_samples_leaf: 1
    min_weight_fraction_leaf: 0.0
    max_depth: 3
