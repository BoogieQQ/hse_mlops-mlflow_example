params:
  dataset: scikit-learn/adult-census-income
  test_size: 0.25
  subsample_train_size: 1.0
  columns:
    num_features:
      - age
      - fnlwgt
      - education.num
      - capital.gain
      - capital.loss
      - hours.per.week
    cat_features:
      - workclass
      - education
      - marital.status
      - occupation
      - relationship
      - race
      - sex
      - native.country
    ignore_features:
    target:
      - income
  preprocess:
    cat_encoder: target # ohe, ordial, target